  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap — Log In or Sign Up</title>
  <meta name="description" content="Log in or create a 1-to-1 skill exchange account on SkillSwap.">
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4M7 4L3 8M7 4L11 8"/>
            <path d="M17 8V20M17 20L21 16M17 20L13 16"/>
          </svg>
        </div>
        <span class="logo-text">SkillSwap</span>
      </a>

      <div class="nav-right">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
      </div>
    </div>
  </header>

  <!-- Auth Main Card Centered Section -->
  <main class="auth-section">
    <div class="container auth-container">
      <div class="auth-card">
        
        <!-- Auth Header -->
        <div id="authHeader" class="auth-card-header">
          <h1 id="authTitle" class="auth-title">Welcome back</h1>
          <p id="authSubtitle" class="auth-subtitle">Log in to your 1-to-1 skill exchange account</p>
        </div>

        <!-- Segmented Mode Control -->
        <div id="authTabs" class="segmented-control" role="tablist">
          <button id="loginTab" class="segmented-tab active" role="tab" type="button">Log In</button>
          <button id="signupTab" class="segmented-tab" role="tab" type="button">Sign Up</button>
        </div>

        <!-- Error Alert -->
        <div id="authErrorAlert" class="auth-error-alert hidden-field" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="authErrorMsg">Invalid email or password.</span>
        </div>

        <!-- Auth Form (Log In / Sign Up) -->
        <form id="authForm" class="auth-form" novalidate>

          <!-- Full Name Field (Sign Up Only) -->
          <div id="nameGroup" class="form-group hidden-field">
            <label for="fullNameInput" class="form-label">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="fullNameInput" class="form-input" placeholder="e.g. Alex Morgan" autocomplete="name">
            </div>
          </div>

          <!-- Email Address -->
          <div id="emailGroup" class="form-group">
            <label for="emailInput" class="form-label">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="emailInput" class="form-input" placeholder="alex@example.com" required autocomplete="email">
            </div>
          </div>

          <!-- Password -->
          <div id="passwordGroup" class="form-group">
            <div class="label-row">
              <label for="passwordInput" class="form-label">Password</label>
            </div>
            <div class="input-wrapper">
              <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="authSubmitBtn" class="btn-primary auth-submit-btn">
            <span id="submitBtnText">Log In</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Mode Switch Prompt -->
        <p id="switchPrompt" class="auth-switch-prompt">
          Don't have an account? <a href="#" id="switchTabLink" class="auth-link-bold">Sign Up</a>
        </p>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-container">
      <p class="footer-copy">© 2026 SkillSwap. 1-to-1 Skill Exchange Platform.</p>
      <a href="admin-auth.html" class="footer-tag" style="text-decoration: none; font-size: 0.85rem; color: var(--text-subtle); opacity: 0.4;">.</a>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="store.js"></script>
  <script src="auth.js"></script>
</body>
</html>
