<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap — Admin Portal Authentication</title>
  <meta name="description" content="Admin Sign In and Management Portal for SkillSwap.">
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon admin-logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <span class="logo-text">SkillSwap Admin</span>
      </a>

      <div class="nav-right">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Main Site
        </a>
      </div>
    </div>
  </header>

  <!-- Auth Main Card -->
  <main class="auth-section">
    <div class="container auth-container">
      <div class="auth-card">
        
        <!-- Auth Header -->
        <div class="auth-card-header">
          <div class="admin-badge">ADMINISTRATION PORTAL</div>
          <h1 id="adminAuthTitle" class="auth-title">Admin Sign In</h1>
          <p id="adminAuthSubtitle" class="auth-subtitle">Sign in with system administrator credentials</p>
        </div>

        <!-- Error Alert -->
        <div id="adminAuthErrorAlert" class="auth-error-alert hidden-field" role="alert">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="adminAuthErrorMsg">Invalid admin credentials.</span>
        </div>

        <!-- Auth Form -->
        <form id="adminAuthForm" class="auth-form" novalidate style="margin-top: 1rem;">

          <!-- Admin Email -->
          <div class="form-group">
            <label for="adminEmailInput" class="form-label">Admin Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="adminEmailInput" class="form-input" placeholder="Enter admin email address" required>
            </div>
          </div>

          <!-- Admin Password -->
          <div class="form-group">
            <label for="adminPasswordInput" class="form-label">Password</label>
            <div class="input-wrapper">
              <input type="password" id="adminPasswordInput" class="form-input" placeholder="••••••••" required>
              <button type="button" id="toggleAdminPasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility">
                <svg id="adminEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="adminAuthSubmitBtn" class="btn-primary auth-submit-btn">
            <span id="adminSubmitBtnText">Sign In to Admin Dashboard</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </form>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-container">
      <p class="footer-copy">© 2026 SkillSwap. 1-to-1 Skill Exchange Platform Admin Console.</p>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="store.js"></script>
  <script src="admin-auth.js"></script>
</body>
</html>
